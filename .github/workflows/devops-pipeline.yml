name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Test URL Shortener Application (Python / Pytest)
  # -------------------------------------------------------------
  test-app:
    name: "Application Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest flake8

      - name: Run Linting (Flake8)
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest tests/test_app.py -v

  # -------------------------------------------------------------
  # Job 2: Terraform Validation & Security Linting
  # -------------------------------------------------------------
  terraform-ci:
    name: "Terraform IaC Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Backend agnostic)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # -------------------------------------------------------------
  # Job 3: Puppet Manifests Syntax & Linting
  # -------------------------------------------------------------
  puppet-lint:
    name: "Puppet Manifest Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install puppet-lint
        run: gem install puppet-lint

      - name: Lint Puppet Manifests
        run: |
          find puppet -name "*.pp" -exec puppet-lint --no-autoloader_layout-check --no-140chars-check --no-documentation-check {} + || true

  # -------------------------------------------------------------
  # Job 4: Optional Automated Infrastructure Plan (CD Trigger)
  # -------------------------------------------------------------
  terraform-plan:
    name: "Terraform Plan (AWS)"
    needs: [test-app, terraform-ci, puppet-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Configure AWS Credentials
        if: "${{ env.AWS_ACCESS_KEY_ID != '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Terraform Init
        if: "${{ env.AWS_ACCESS_KEY_ID != '' }}"
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Terraform Plan
        if: "${{ env.AWS_ACCESS_KEY_ID != '' }}"
        run: terraform plan -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
