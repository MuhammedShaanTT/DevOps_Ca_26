# check_nrpe and check_nrpe_1arg are already provided by nagios-nrpe-plugin in:
# /etc/nagios-plugins/config/check_nrpe.cfg

# Custom HTTP check that validates both /health URI and expected response body
define command {
    command_name    check_http_health
    command_line    /usr/lib/nagios/plugins/check_http -H '$HOSTADDRESS$' -I '$HOSTADDRESS$' -u '$ARG1$' -e 200 -s '$ARG2$'
}
