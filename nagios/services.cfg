# Nagios Service Definitions for web-servers Hostgroup

# 1. PING Check
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. SSH Service Check
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     SSH
    check_command           check_ssh
}

# 3. HTTP Health Check (URL Shortener Application /health endpoint)
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     HTTP URL-Shortener Health
    check_command           check_http_health!/health!UP
}

# 4. Root Disk Usage via NRPE
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     Root Disk Usage
    check_command           check_nrpe!check_disk
}

# 5. CPU Load via NRPE
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     CPU Load Average
    check_command           check_nrpe!check_load
}

# 6. Gunicorn Application Process via NRPE
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     Process - URL Shortener
    check_command           check_nrpe!check_urlshortener_proc
}

# 7. Nginx Web Server Process via NRPE
define service {
    use                     generic-service
    hostgroup_name          web-servers
    service_description     Process - Nginx Web Server
    check_command           check_nrpe!check_nginx_proc
}
